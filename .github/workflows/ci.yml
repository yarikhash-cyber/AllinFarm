name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python — style, types, boundaries, tests
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: allinfarm
          POSTGRES_PASSWORD: allinfarm
          POSTGRES_DB: allinfarm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U allinfarm -d allinfarm"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://allinfarm:allinfarm@localhost:5432/allinfarm
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Module boundaries (ADR 0003)
        run: uv run lint-imports
      - name: Migrations
        run: uv run alembic -c apps/api/alembic.ini upgrade head
      - name: Tests
        run: uv run pytest

  web:
    name: Site — types, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Types (svelte-check)
        run: pnpm -C apps/web check
      - name: Lint and module boundaries (ADR 0003)
        run: pnpm -C apps/web lint
      - name: Build
        run: pnpm -C apps/web build

  licenses:
    name: Dependency licenses (ADR 0001)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - run: uv run python scripts/check_licenses.py

  secrets:
    name: No secrets in the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 \
            git /repo --redact --verbose --exit-code 1

  system:
    name: Whole system in Docker (ADR 0004)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: docker compose up
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Site and API answer through Caddy
        run: |
          curl --fail --silent --show-error http://localhost:8080/ | grep -q "<html"
          curl --fail --silent --show-error http://localhost:8080/fields/any/path | grep -q "<html"
          health=$(curl --fail --silent --show-error http://localhost:8080/api/health)
          echo "$health"
          echo "$health" | python3 -c 'import json,sys; h=json.load(sys.stdin); assert h["status"]=="ok" and h["database"]["postgis"], h'
          curl --fail --silent --show-error --output /dev/null http://localhost:8025/
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Clean up
        if: always()
        run: docker compose down --volumes
